<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>无障碍验收台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <section class="page-hero" aria-labelledby="page-title">
          <div class="brand-title">
            <div>
              <h1 id="page-title">无障碍验收台</h1>
            </div>
          </div>
          <div class="hero-actions">
            <button class="secondary-action" data-new-audit type="button">新建审计</button>
            <a class="secondary-action history-entry" href="/history.html">历史报告</a>
          </div>
        </section>

        <p class="hero-copy">基于 WCAG 标准、页面证据链和多模态 AI 推理的无障碍体验审计助手</p>

        <div class="audit-layout">
          <form class="setup-panel" data-audit-form>
            <div class="panel-heading">
              <h3>输入</h3>
            </div>

            <fieldset>
              <legend>目标页面</legend>
              <label>
                URL
                <input name="url" required placeholder="例如：https://example.com/login" />
              </label>
              <label>
                页面名称
                <input name="name" placeholder="例如：系统登录页" />
              </label>
              <label>
                环境 / 账号说明
                <textarea name="notes" rows="3" placeholder="测试环境、账号、权限或入口说明"></textarea>
              </label>
            </fieldset>

            <fieldset>
              <legend>运行参数</legend>
              <div class="control-grid">
                <label>
                  <span class="field-label-row">
                    视口

                      </svg>
                    </span>
                  </span>
                  <select name="viewport">
                    <option value="1440x1000">桌面 1440×1000</option>
                    <option value="1280x800">笔记本 1280×800</option>
                    <option value="390x844">移动 390×844</option>
                  </select>
                </label>
                <label>
                  <span class="field-label-row">
                    键盘遍历次数
                    <span class="info-tooltip" tabindex="0" aria-label="连续按 Tab，记录焦点顺序、焦点可见性和疑似键盘陷阱。" data-tooltip="连续按 Tab，记录焦点顺序、焦点可见性和疑似键盘陷阱。">
                      <svg viewBox="0 0 1024 1024" aria-hidden="true">
                        <path d="M512 64c247.424 0 448 200.576 448 448S759.424 960 512 960 64 759.424 64 512 264.576 64 512 64z m0 64c-212.077 0-384 171.923-384 384s171.923 384 384 384 384-171.923 384-384-171.923-384-384-384z m-0.573 576.225c13.714 0 25.47 4.028 34.612 13.427 9.143 8.727 13.714 20.14 13.714 34.238 0 14.098-4.571 25.51-13.714 34.909-9.796 8.727-21.551 13.426-34.612 13.426-13.714 0-24.817-4.699-33.306-14.098-9.796-9.398-14.368-20.81-14.368-34.237 0-12.084 3.359-22.195 10.487-30.333l3.88-3.905c8.49-9.399 19.593-13.427 33.307-13.427z m1.764-472.694c57.96 0 101.444 20.808 128.756 57.657C662.54 316.97 672 351.467 672 384c0 32.601-8.77 60.4-25.436 85.217l-0.758 1.12-0.759 1.107-0.952 1.367-0.957 1.348-0.77 1.066-0.774 1.057-0.78 1.047-0.785 1.04-0.792 1.032-0.799 1.025-0.806 1.02-0.815 1.015-0.825 1.01-0.834 1.007-0.844 1.005-0.855 1.002-0.432 0.501-1.315 1.502-0.892 1.002-0.907 1.003-0.458 0.503-0.928 1.007-0.943 1.01-1.445 1.523-1.483 1.536-1.011 1.032-1.03 1.039-1.048 1.047-1.069 1.056-1.642 1.603-1.12 1.082-1.725 1.645-1.178 1.113-1.811 1.696-1.239 1.148-1.906 1.753-1.965 1.791-1.345 1.217-2.07 1.86-2.86 2.552-2.984 2.638-7.835 6.887-3.532 3.133-2.218 1.986-2.626 2.378-1.502 1.373-1.447 1.336-1.396 1.3-1.346 1.268-0.87 0.828-0.85 0.814-1.236 1.198-1.193 1.172-0.771 0.767-1.124 1.132-0.727 0.743-0.711 0.734-1.036 1.087-1.328 1.424-0.958 1.052-0.622 0.694-0.61 0.69-0.596 0.687-0.873 1.024-0.569 0.68-0.557 0.677-0.549 0.677-0.538 0.676-0.53 0.676-0.522 0.677-0.514 0.678-0.507 0.68-0.749 1.024-0.735 1.033-0.484 0.693c-8.41 12.147-12.665 24.58-12.981 40.087l-0.011 0.607V640h-9.023c-29.458 0-53.338-23.88-53.338-53.339 0-3.206 0.289-6.404 0.863-9.557l0.163-0.859c3.645-18.305 10.972-34.948 21.708-50.455l1.105-1.579 0.739-1.037 0.741-1.026 0.745-1.017 0.749-1.006 0.754-0.998 0.759-0.99 0.765-0.983 0.772-0.977 0.78-0.971 0.788-0.967 0.797-0.964 0.402-0.48 1.22-1.438 0.829-0.957 0.839-0.957 0.852-0.957 0.865-0.958 1.323-1.442 0.9-0.965 0.916-0.97 0.932-0.973 0.95                       </svg>
                    </span>
                  </span>
                  <input name="maxTabs" type="number" min="5" max="80" value="30" />
                </label>
                <label class="checkbox-control">
                  <input name="aiEnabled" type="checkbox" checked />
                  <span>启用 AI 语义复核</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>页面操作步骤</legend>
              <p class="section-hint">用于先进入要验收的状态，比如登录、打开新增弹窗、提交表单后检查 toast。简单页面可以不填。</p>
              <div class="steps-toolbar">
                <button type="button" class="secondary-action" data-add-step>+ 添加步骤</button>
                <button type="button" class="secondary-action" data-clear-steps>清空</button>
              </div>
              <div class="steps-list" data-steps-list></div>
            </fieldset>

            <div class="form-actions">
              <button class="audit-command" data-run-audit type="submit">
                <span class="loading-spinner" data-loading-spinner aria-hidden="true"></span>
                <svg class="command-icon" data-command-icon viewBox="0 0 1024 1024" aria-hidden="true">
                  <path d="M170.666667 128l2.133333 768c0 34.133333 36.266667 53.333333 64 34.133333l597.333333-384c25.6-17.066667 25.6-53.333333 0-70.4L234.666667 91.733333C206.933333 74.666667 170.666667 93.866667 170.666667 128z" fill="currentColor"></path>
                </svg>
                <span data-command-label>开始审计</span>
              </button>
            </div>
          </form>

          <section class="result-panel" aria-label="审计结果">
            <div class="panel-heading result-heading">
              <div>
                <h3>本次审计结果</h3>
              </div>
              <div class="artifact-bar" data-artifact-bar></div>
            </div>

            <div class="empty-state" data-empty-state>
              <div class="blueprint-mark" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <h3>等待审计结果</h3>
              <p>点击输入面板中的按钮运行后，结果会显示在这里。</p>
            </div>

            <div class="result-content" data-result hidden>
              <div class="summary-strip" data-summary-strip></div>
              <div class="ai-panel" data-ai-panel></div>
              <div class="issue-toolbar">
                <label>
                  严重级别
                  <select data-severity-filter>
                    <option value="all">全部</option>
                    <option value="Blocker">阻断</option>
                    <option value="Major">严重</option>
                    <option value="Minor">一般</option>
                    <option value="Suggestion">建议</option>
                  </select>
                </label>
                <label>
                  检测层级
                  <select data-tier-filter>
                    <option value="all">全部</option>
                    <option value="自动规则">自动规则</option>
                    <option value="组件规则">组件规则</option>
                    <option value="行为检测">行为检测</option>
                    <option value="AI辅助判断">AI辅助判断</option>
                    <option value="人工确认">人工确认</option>
                  </select>
                </label>
              </div>
              <div class="issue-list" data-issue-list></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <template id="step-template">
      <div class="step-row">
        <select data-step-action>
          <option value="wait">等待</option>
          <option value="click">点击</option>
          <option value="fill">填写</option>
          <option value="press">按键</option>
          <option value="waitForSelector">等待元素</option>
        </select>
        <input data-step-selector placeholder="CSS selector" />
        <input data-step-value placeholder="值 / 按键 / 毫秒" />
        <button type="button" aria-label="删除步骤" data-remove-step>×</button>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
